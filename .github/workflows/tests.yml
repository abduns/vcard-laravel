name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout laravel-vcard (this repo)
        uses: actions/checkout@v4
        with:
          path: laravel-vcard

      - name: Checkout core vcard package
        uses: actions/checkout@v4
        with:
          repository: abduns/vcard
          path: vcard

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        working-directory: laravel-vcard
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        working-directory: laravel-vcard
        run: composer test

      - name: Execute static analysis
        working-directory: laravel-vcard
        run: composer stan
